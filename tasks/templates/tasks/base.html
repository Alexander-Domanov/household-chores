<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Household Chores{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        nav { margin-bottom: 1rem; }
        nav a { margin-right: 1rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; vertical-align: top; }
        th { background: #f0f0f0; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.85em; color: #fff; }
        .badge-new { background: #888; }
        .badge-in_progress { background: #e6a700; }
        .badge-done { background: #2e8b57; }
        .errorlist { color: #b00; }
        form p { margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'task_list' %}">All tasks</a>
        <a href="{% url 'task_create' %}">Add task</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
